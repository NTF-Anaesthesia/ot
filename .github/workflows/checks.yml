name: Checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tools/check.mjs
      - run: node tools/proofread.mjs
      - name: OT model and browser tests
        run: |
          npm i --no-save playwright@1 >/dev/null 2>&1 && npx playwright install --with-deps chromium >/dev/null 2>&1
          PLAYWRIGHT_PATH="$PWD/node_modules/playwright/index.mjs" tools/test-ot.sh
